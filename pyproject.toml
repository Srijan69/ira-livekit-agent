[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    # The [google] extra pulls in livekit-plugins-google, which provides the
    # Gemini Live API realtime model used in src/agent.py.
    "livekit-agents[google]>=1.8.8",
    "livekit-plugins-ai-coustics~=0.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    # Native browser contexts, locators and input through Playwright.
    "playwright>=1.64.1,<2",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "python-dotenv",
    "uiautomation>=2.0.29 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Lets tests do `from agent import Assistant` -- src/ is not an installed
# package, so without this pytest only puts tests/ on sys.path.
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    "ignore:.*google.genai.*:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
