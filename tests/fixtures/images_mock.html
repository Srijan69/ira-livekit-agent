<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk City Photos | Stock Photography</title>
</head>
<body>
  <h1>Cyberpunk City Free Photos</h1>
  <div class="photo-grid">
    <figure data-test="photo-grid-image">
      <img src="https://images.unsplash.com/photo-city-neon-night-1"
           data-highres="https://images.unsplash.com/photo-city-neon-night-1?w=1920&q=80"
           alt="Cyberpunk Tokyo neon lights in rain" />
      <figcaption>Neon City 1</figcaption>
    </figure>
    <figure data-test="photo-grid-image">
      <img src="https://images.unsplash.com/photo-cyberpunk-skyscrapers-2"
           data-highres="https://images.unsplash.com/photo-cyberpunk-skyscrapers-2?w=1920&q=80"
           alt="Futuristic glowing skyscraper skyline" />
      <figcaption>Cyberpunk Skyscrapers 2</figcaption>
    </figure>
    <figure data-test="photo-grid-image">
      <img src="https://images.unsplash.com/photo-flying-cars-dystopia-3"
           data-highres="https://images.unsplash.com/photo-flying-cars-dystopia-3?w=1920&q=80"
           alt="Dystopian neon street with flying vehicles" />
      <figcaption>Futuristic Alley 3</figcaption>
    </figure>
  </div>
</body>
</html>
